<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Welcome to my website">
  <title>My Website</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f7fb;
      color: #172033;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #101827;
      color: white;
      padding: 22px 8%;
    }
    header h1 { font-size: 1.5rem; }
    main {
      width: min(900px, 90%);
      margin: auto;
      padding: 72px 0;
      text-align: center;
    }
    .tag {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 999px;
      background: #dceafe;
      color: #174ea6;
      font-size: 0.9rem;
      margin-bottom: 22px;
    }
    h2 {
      font-size: clamp(2.2rem, 6vw, 4rem);
      line-height: 1.1;
      margin-bottom: 18px;
    }
    p {
      color: #526078;
      font-size: 1.1rem;
      line-height: 1.7;
      max-width: 620px;
      margin: 0 auto 28px;
    }
    a.button {
      display: inline-block;
      background: #2563eb;
      color: white;
      text-decoration: none;
      padding: 13px 22px;
      border-radius: 10px;
      font-weight: bold;
    }
    a.button:hover { background: #1d4ed8; }
    footer {
      text-align: center;
      padding: 20px;
      color: #68758a;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>My Website</h1>
  </header>

  <main>
    <span class="tag">Welcome</span>
    <h2>Your website is live.</h2>
    <p>
      This is your homepage. Edit the heading, description, and button link
      to make it your own. Save this file as <strong>index.html</strong>.
    </p>
    <a class="button" href="mailto:hello@example.com">Contact Me</a>
  </main>

  <footer>
    &copy; <span id="year"></span> My Website. All rights reserved.
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
